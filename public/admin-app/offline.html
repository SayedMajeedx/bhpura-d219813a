<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e202c" />
    <title>Boutq · لا يوجد اتصال</title>
    <!--
      The installed admin's page when it opens with no connection (kept on the device by
      public/admin-sw.js). Self-contained: no file it needs can be fetched offline. It goes back to
      where the person was as soon as the connection returns.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1e202c;
        --paper: #fcfcfd;
        --muted: #6b6f80;
        --line: #e4e5ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f2f3f6;
          --paper: #1c1e28;
          --muted: #a2a6b5;
          --line: #2e3140;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, "Noto Sans Arabic", Roboto,
          sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.4;
      }
      p {
        margin: 0;
        max-width: 22rem;
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
      }
      .en {
        direction: ltr;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      button {
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: var(--paper);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>

    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      window.addEventListener("online", function () {
        location.reload();
      });
