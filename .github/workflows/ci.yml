name: CI & Release Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Codebase Validation & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

  build:
    name: Production Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  playwright-smoke:
    name: Playwright Browser Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        # These are the Supabase project URL and publishable/anon key only —
        # both are already shipped in every visitor's browser bundle in
        # production, so they are not secrets. The smoke tests mock every
        # Supabase network call via page.route(); this just lets the dev
        # server boot (createSupabaseClient throws otherwise) rather than
        # timing out before a single test can run.
        env:
          VITE_SUPABASE_URL: https://ikciahnuqhemvnyfvbyp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mZLaZzhuKAqvgwpsZmRslQ_YahrHqxy
        run: npx playwright test

      - name: Upload Playwright report artifact on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  supabase-migrations:
    name: Validate Supabase SQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate migration history integrity
        run: node scripts/database/check-migration-integrity.mjs

      - name: Apply & Validate Migrations Against Local Postgres
        env:
          PGPASSWORD: postgres
        run: |
          echo "Testing SQL migration syntax and applying sequence against PostgreSQL..."
          for file in $(ls supabase/migrations/*.sql | sort -V); do
            echo "Applying: $file"
            psql -h localhost -U postgres -d postgres -f "$file" > /dev/null
          done
          echo "All migrations applied successfully without syntax or execution errors."

  security-scan:
    name: Security Vulnerability & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit
        run: npm audit --audit-level=high

      - name: Run Gitleaks Secret Scan
        # The SHA this was previously pinned to (7007d4f9...) did not
        # correspond to any real commit on gitleaks/gitleaks-action, so the
        # step failed before ever running. This is the actual SHA for the
        # v2.3.7 tag the comment already claimed.
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
