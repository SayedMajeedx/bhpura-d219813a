name: White-Label Android Factory

on:
  repository_dispatch:
    types: [white-label-build]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WHITE_LABEL_BUILD_ID: ${{ github.event.client_payload.build_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/pura-line-mobile/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Install factory dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: apps/pura-line-mobile
        run: npm ci --legacy-peer-deps
      - name: Materialize tenant application
        run: node scripts/white-label/prepare-build.mjs
      - name: Generate Android project
        working-directory: apps/pura-line-mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Restore Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/pura-line-mobile/android/**/*.gradle*', 'apps/pura-line-mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Restore signing key
        working-directory: apps/pura-line-mobile/android/app
        env:
          KEYSTORE_B64: ${{ secrets.WHITE_LABEL_ANDROID_KEYSTORE_B64 }}
        run: test -n "$KEYSTORE_B64" && printf '%s' "$KEYSTORE_B64" | base64 --decode > boutq-white-label.jks
      - name: Configure release signing
        working-directory: apps/pura-line-mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.WHITE_LABEL_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WHITE_LABEL_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WHITE_LABEL_ANDROID_KEY_PASSWORD }}
        run: |
          printf '\nBOUTQ_UPLOAD_STORE_FILE=boutq-white-label.jks\nBOUTQ_UPLOAD_KEY_ALIAS=%s\nBOUTQ_UPLOAD_STORE_PASSWORD=%s\nBOUTQ_UPLOAD_KEY_PASSWORD=%s\n' "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" >> gradle.properties
          node ../../../scripts/white-label/configure-signing.mjs
      - name: Build signed APK
        working-directory: apps/pura-line-mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Verify and store APK permanently
        run: node scripts/white-label/upload-apk.mjs
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: white-label-${{ env.WHITE_LABEL_BUILD_ID }}
          path: apps/pura-line-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: white-label-aab-${{ env.WHITE_LABEL_BUILD_ID }}
          path: apps/pura-line-mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Record build result
        if: always()
        env:
          BUILD_OUTCOME: ${{ job.status }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/white-label/complete-build.mjs
